name: cucumber-console
description: Local recorded-study trace viewer and human check
command: <home>/.nix-profile/bin/node
args: [scripts/console.mjs]
workdir: <home>/projects/cucumber-mcp-study
environment:
  CONSOLE_HOST: "127.0.0.1"
  CONSOLE_PORT: "7878"
restart: on-failure
private_tmp: true
no_new_privileges: true
