# Same as study-behat.yml, but the default suite covers only /tmp/study-runs (a list in a child config
# replaces the parent's), so generated data-only features outside Moodle's feature list can run.
imports:
  - /opt/study-behat/study-behat.yml
default:
  suites:
    default:
      paths:
        - /tmp/study-runs
