# Same as study-behat.yml, but the default suite lists only the features that Moodle's generated configuration leaves out because of their
# @_cross_browser tag (a list in a child config replaces the parent's). Used only for the scenarios of those features (S009); every other
# scenario keeps running under study-behat.yml, so nothing else changes.
imports:
  - /opt/study-behat/study-behat.yml
default:
  suites:
    default:
      paths:
        - /var/www/html/public/course/tests/behat/section_visibility.feature
